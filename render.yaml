services:
  # RoadGuard AI FastAPI Backend Service
  - type: web
    name: roadguard-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: roadguard-db
          property: connectionString

databases:
  # Optional persistent PostgreSQL instance on Render
  - name: roadguard-db
    databaseName: roadguard
    user: roadguard_user
    plan: free

